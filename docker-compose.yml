version: '3.8'

services:
  # 1. Cơ sở dữ liệu PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: wordduel_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: wordduel_db
    ports:
      - "5432:5432"
    volumes:
      # Lưu trữ dữ liệu ra ngoài máy host, tắt container không bị mất dữ liệu
      - postgres_data:/var/lib/postgresql/data

  # 2. Redis phục vụ WebSocket & lưu tiến độ Real-time (Chuẩn bị cho Phase 3)
  redis:
    image: redis:alpine
    container_name: wordduel_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
