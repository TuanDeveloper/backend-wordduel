version: '3.8'

services:
  # 1. Cơ sở dữ liệu PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: wordduel_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wordduel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment environment}
      POSTGRES_DB: ${POSTGRES_DB:-wordduel_db}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Lưu trữ dữ liệu ra ngoài máy host, tắt container không bị mất dữ liệu
      - postgres_data:/var/lib/postgresql/data

  # 2. Redis phục vụ WebSocket & lưu tiến độ Real-time (Chuẩn bị cho Phase 3)
  redis:
    image: redis:alpine
    container_name: wordduel_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in the deployment environment}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
